<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunsai AI Studio</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #1e1e2e; /* Dark mode background */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            width: 100%; 
            max-width: 600px; 
            background: #2a2a35; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            display: flex; 
            flex-direction: column; 
            height: 80vh; 
            overflow: hidden; 
        }
        .header {
            background: #3a3a4a;
            color: white;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        #chat-log { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { 
            padding: 12px 18px; 
            border-radius: 18px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 0.95rem;
        }
        .user-msg { 
            background-color: #007bff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        .ai-msg { 
            background-color: #3e3e50; 
            color: #e0e0e0; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }
        .input-area { 
            display: flex; 
            border-top: 1px solid #444; 
            padding: 15px; 
            background: #2a2a35; 
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #555; 
            border-radius: 8px; 
            background: #1e1e2e;
            color: white;
            outline: none; 
            font-size: 1rem;
        }
        #user-input::placeholder { color: #888; }
        #user-input:focus { border-color: #007bff; }
        #send-btn { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            margin-left: 10px; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        #send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="header">Sunsai AI Studio</div>
    <div id="chat-log">
        <div class="message ai-msg">Server is live! Send a message to test Gemma 4. (Note: The first message may take ~15 seconds to wake up the GPU).</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message Gemma..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    
    // VERIFY THIS URL MATCHES YOUR DEPLOYMENT TERMINAL OUTPUT EXACTLY
    const MODAL_URL = 'https://thahmunmang--sunsai-gemma4-vllm-model-server-sunsaitesting.modal.run/v1/chat/completions';

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.textContent = text;
        chatLog.appendChild(msgDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';
        
        // Show loading indicator
        const loadingId = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('message', 'ai-msg');
        loadingDiv.id = loadingId;
        loadingDiv.innerHTML = '<i>Thinking...</i>';
        chatLog.appendChild(loadingDiv);
        chatLog.scrollTop = chatLog.scrollHeight;

        try {
            const response = await fetch(MODAL_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer EMPTY'
                },
                body: JSON.stringify({
                    model: 'google/gemma-4-E4B-it',
                    messages: [{ role: 'user', content: text }],
                    max_tokens: 2048,
                    temperature: 0.7
                })
            });

            // Remove loading indicator
            document.getElementById(loadingId).remove();

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            if (data.choices && data.choices.length > 0) {
                appendMessage(data.choices[0].message.content, 'ai');
            } else {
                appendMessage("Error: Received an empty response from the server.", 'ai');
            }

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Connection error. If the Modal deployment succeeded, this is likely a CORS error blocking your browser. Check the developer console (F12).", 'ai');
            console.error('Fetch error:', error);
        }
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>
</body>
</html>
